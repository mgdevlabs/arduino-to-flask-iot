name: CI

on:
  push:
    branches:
    - main

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.13"
      - run: pip install -r recquirements.txt recquirements-dev.txt 
      - run: pytest
      
